[general]
interval=15
smsdb=/var/lib/asterisk/smsdb
csmsttl=600

[defaults]
context=incoming-mobile
group=0
rxgain=0
txgain=0
autodeletesms=yes
resetquectel=yes
usecallingpres=yes
callingpres=allowed_passed_screen
disablesms=no
language=en
callwaiting=yes
disable=no
initstate=start
dtmf=relax

[quectel0]
data=__AT_PORT__                    ; AT 命令端口（用户传入）
quec_uac=1                         ; 启用 UAC 模式（UAC 走 ALSA，不走 tty 音频）
alsadev=__ALSA_DEV__               ; ALSA 音频设备（用户传入）
